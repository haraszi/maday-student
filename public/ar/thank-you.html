<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شكرًا · maday.ae</title>
<meta name="robots" content="noindex">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/fonts/fonts-ar.css" rel="stylesheet">
<style>
:root { --bg: #FFFFFF; --ink: #1E1033; --muted: #5B4E6E; --yellow: #FFD21F; --red: #E5322D; --card: #FFFFFF; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #150E22; --ink: #FFF6DC; --muted: #C4B8D6; --card: #1D1330; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #150E22; --ink: #FFF6DC; --muted: #C4B8D6; --card: #1D1330; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.8 "IBM Plex Sans Arabic", "DM Sans", "Segoe UI", Tahoma, sans-serif; }
a { color: inherit; }
.bar { border-bottom: 2px solid var(--ink); }
.in { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.bar .in { padding-block: 12px; }
.brand img { height: 36px; width: auto; display: block; }
main { padding-block: clamp(40px, 8vw, 88px); }
.card { border: 3px solid var(--ink); border-radius: 24px; padding: clamp(22px, 5vw, 36px); background: var(--card); box-shadow: -6px 6px 0 var(--ink); display: flex; flex-direction: column; gap: 16px; }
.badge { width: 72px; height: 72px; border: 3px solid var(--ink); border-radius: 22px; display: grid; place-items: center; font: 800 2.2rem "Bricolage Grotesque", sans-serif; background: var(--yellow); color: #1E1033; transform: rotate(5deg); }
h1 { font: 800 clamp(2rem, 6vw, 3rem)/1.3 "Baloo Bhaijaan 2", "Bricolage Grotesque", sans-serif; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.spin { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; vertical-align: -3px; margin-left: 8px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<header class="bar"><div class="in"><a class="brand" href="/ar/"><img src="/images/brand/maday-logo.svg" alt="maday" width="114" height="36"></a></div></header>
<main class="in">
  <div class="card" aria-live="polite">
    <div class="badge" id="badge" aria-hidden="true">…</div>
    <h1 id="title">جاري تأكيد الدفع</h1>
    <p id="msg"><span class="spin" aria-hidden="true"></span>عادةً ياخذ هذا كم ثانية. لو سمحت خلّ الصفحة مفتوحة.</p>
    <p class="muted" id="foot">عندك سؤال؟ راسلنا على <a href="mailto:hello@maday.ae">hello@maday.ae</a>.</p>
  </div>
</main>
<script>
(function () {
  var order = new URLSearchParams(location.search).get("order") || "";
  var tries = 0;
  function show(badge, title, html) {
    document.getElementById("badge").textContent = badge;
    document.getElementById("title").textContent = title;
    document.getElementById("msg").innerHTML = html;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function check() {
    tries++;
    fetch("/api/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ order: order }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.status === "paid") {
          show("✓", "شكرًا، كل شي جاهز!", "تم تأكيد الدفع. أرسلت لك خطواتك الجاية على <b dir=\"ltr\">" + esc(j.email) + "</b>. إذا ما شفت الإيميل خلال دقايق، شيّك على مجلد الرسائل غير المرغوب فيها (Spam).");
        } else if (j.status === "failed" || j.status === "canceled") {
          show("!", "الدفع ما تم", "ما انخصم منك شي. <a href=\"/ar/deep-dive.html\">جرّب مرة ثانية</a>، أو راسلنا على hello@maday.ae إذا تحتاج مساعدة.");
        } else if (j.status === "unknown") {
          show("?", "ما لقينا طلبك", "إذا دفعت، لا تشيل هم: راسلنا على hello@maday.ae وبنحلّها على طول.");
        } else if (tries < 12) {
          setTimeout(check, 4000);
        } else {
          show("✓", "شكرًا!", "الدفع بعده قيد التأكيد. الإيميل بخطواتك الجاية بيوصلك خلال 10 دقايق تقريبًا. إذا ما وصل، راسلنا على hello@maday.ae.");
        }
      })
      .catch(function () { if (tries < 12) setTimeout(check, 4000); });
  }
  check();
})();
</script>
</body>
</html>
